<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>pics Flipbook — 30 Photos</title>
  <style>
    :root{
      --card-size: 320px; /* base size — responsive below */
      --border: 10px;
      --bg: #fff7fa;
      --accent: #ff2d95;
      --soft: #ffd9ec;
      --duration-total: 36s; /* will be overridden by JS based on count */
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Poppins',sans-serif;background:linear-gradient(180deg,#fffafc 0%, #fff1f8 50%, #fffafc 100%);color:#222}

    /* Page layout */
    .page{
      min-height:100vh;
      display:grid;
      grid-template-rows:auto 1fr auto;
      gap:20px;
      align-items:start;
      justify-items:center;
      padding:28px 16px;
    }

    header{display:flex;gap:18px;align-items:center;justify-content:center;width:100%;}
    .title{
      font-size:clamp(20px,4vw,44px);
      font-weight:800;
      letter-spacing:1px;
      color:var(--accent);
      text-shadow:0 6px 18px rgba(255,45,149,0.12);
    }

    /* Controls */
    .controls{display:flex;gap:12px;align-items:center}
    .btn{background:#fff;border:1px solid #ffd6ea;padding:8px 12px;border-radius:999px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,0.06);font-weight:600}
    .btn:active{transform:translateY(1px)}

    /* Gallery container */
    .frame{
      width:var(--card-size);
      max-width:90vw;
      position:relative;
      perspective:1200px;
      display:grid;place-items:center;
      margin:8px 0 24px;
    }

    /* Card stack */
    .gallery{
      width:100%;
      height:calc(var(--card-size));
      position:relative;
      display:grid;place-items:center;
    }

    .gallery img{
      position:absolute;inset:0;margin:auto;
      width:100%;height:100%;object-fit:cover;border-radius:14px;
      border:var(--border) solid #fff;box-shadow:0 18px 40px rgba(0,0,0,0.18);
      transform-origin:center center;
      backface-visibility:hidden;
      will-change:transform,opacity,z-index;
      transition:transform 550ms cubic-bezier(.2,.9,.24,1),opacity 450ms ease,box-shadow 400ms;
      cursor:grab;
    }

    .gallery img.grabbing{cursor:grabbing}

    /* active (top) card style */
    .gallery img.top{
      z-index:999;transform:translateX(0) translateY(0) scale(1) rotate(0deg);
      box-shadow:0 30px 70px rgba(0,0,0,0.28);
    }

    /* hidden card (moved out) */
    .gallery img.hidden{
      opacity:0;pointer-events:none;transform:translateX(140%) rotate(8deg) scale(.98);
    }

    /* subtle stagger for depth for non-top cards */
    .gallery img.slot{opacity:0.95;transform-origin:center;}

    /* small indicator & page number */
    .meta{display:flex;gap:8px;align-items:center;font-weight:600;color:#333}

    /* floating hearts */
    .hearts{
      position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1200;
    }
    .heart{
      position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0.8);
      width:18px;height:18px;background:linear-gradient(180deg,var(--accent),#ff7fcf);
      clip-path:path('M10 3 C6 -1 0 1 0 6 C0 10 10 14 10 14 C10 14 20 10 20 6 C20 1 14 -1 10 3 Z');
      opacity:0.9;border-radius:4px;filter:drop-shadow(0 6px 16px rgba(255,45,149,0.08));
      animation:rise linear forwards;
    }
    @keyframes rise{
      0%{transform:translateX(0) translateY(0) scale(.8);opacity:1}
      100%{transform:translateX(var(--dx, -40vw)) translateY(var(--dy, -140vh)) scale(1.6);opacity:0}
    }

    /* footer */
    footer{display:flex;gap:12px;align-items:center;justify-content:center;width:100%;padding-bottom:6vh}

    /* responsive */
    @media (max-width:600px){
      :root{--card-size:84vw}
      .btn{padding:8px}
    }

    /* small helpers */
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

    /* Preloader overlay */
    .loader{position:fixed;inset:0;background:linear-gradient(180deg,rgba(255,239,250,0.9),rgba(255,246,248,0.6));display:grid;place-items:center;z-index:1500}
    .loader .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);margin:6px;display:inline-block;animation:dot 0.9s infinite ease-in-out}
    .loader .dot:nth-child(2){animation-delay:.15s}
    .loader .dot:nth-child(3){animation-delay:.3s}
    @keyframes dot{0%{transform:translateY(0)}50%{transform:translateY(-10px)}100%{transform:translateY(0)}}

    /* music control */
    .music-btn{display:inline-flex;align-items:center;gap:8px}

  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="title">Our Time together  💞</div>
    </header>

    <main style="display:grid;place-items:center;">
      <div class="frame">
        <div class="gallery" id="gallery">
          <!-- Images (30) -->
          <!-- Make sure img1.png ... img30.png are placed in same folder as this file -->
<!-- IMAGES_INSERT -->
        </div>
      </div>

      <div class="controls">
        <button class="btn" id="prevBtn" title="Previous">◀ Prev</button>
        <div class="meta"><span id="index">1</span> / <span id="total">30</span></div>
        <button class="btn" id="nextBtn" title="Next">Next ▶</button>

        <div style="width:18px"></div>

        <div class="music-btn">
          <button class="btn" id="playMusic">Play Music</button>
          <button class="btn" id="muteMusic">Mute</button>
        </div>
      </div>
    </main>

    <footer>
      <div>Place <strong>img1.png</strong> ... <strong>img30.png</strong> and <strong>music.mp3</strong> in the same folder, then open this HTML file in your browser.</div>
    </footer>
  </div>

  <div class="hearts" id="hearts"></div>
  <div class="loader" id="loader" aria-hidden="true">
    <div>
      <div style="font-weight:700;margin-bottom:12px;">Loading photos...</div>
      <div style="display:flex;align-items:center;justify-content:center">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>

  <audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>

  <script>
    // ====== Build 30 <img> tags into gallery ======
    const gallery = document.getElementById('gallery');
    const totalImages = 30;
    const imgNames = [];
    for(let i=1;i<=totalImages;i++){
      imgNames.push(`img${i}.png`);
    }

    imgNames.forEach((src, idx)=>{
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.decoding = 'async';
      img.src = src;
      img.alt = `photo ${idx+1}`;
      img.dataset.index = idx; // 0-based
      img.classList.add('slot');
      // give slightly different rotation based on index
      const rot = ((idx - Math.floor(totalImages/2)) * 1.6) + (Math.random()*6 - 3);
      img.style.transform = `translateX(0) translateY(0) rotate(${rot}deg)`;
      gallery.appendChild(img);
    });

    // Update total in UI
    document.getElementById('total').textContent = totalImages;

    // ====== simple preloader until images are loaded ======
    const loader = document.getElementById('loader');
    const imgs = Array.from(gallery.querySelectorAll('img'));
    let loaded = 0;
    imgs.forEach(img=>{
      img.addEventListener('load', ()=>{
        loaded++;
        if(loaded === imgs.length){
          loader.style.display = 'none';
          initGallery();
        }
      });
      img.addEventListener('error', ()=>{
        // show anyway to avoid stuck loader
        loaded++;
        img.style.opacity = 0.6; img.style.filter = 'grayscale(.2)';
        if(loaded === imgs.length){
          loader.style.display = 'none';
          initGallery();
        }
      });
    });

    // Fallback: if images cached and already complete
    setTimeout(()=>{
      if(loaded < imgs.length){
        loader.style.display = 'none';
        initGallery();
      }
    },3500);

    // ====== gallery behaviour ======
    function initGallery(){
      // calculate card order: last image is top by default
      let index = 0; // active index (0..totalImages-1)
      const total = imgs.length;

      // set initial stacking and transforms
      function applyStack(){
        imgs.forEach((el,i)=>{
          const pos = (i - index + total) % total; // relative position from active
          el.style.zIndex = total - pos;
          el.classList.remove('top','hidden');
          if(pos === 0){
            el.classList.add('top');
            el.style.opacity = 1;
            el.style.pointerEvents = 'auto';
            el.style.transform = 'translateX(0) rotate(0deg) scale(1)';
          } else if(pos <= 6){
            const s = 1 - pos*0.02;
            const x = pos*8;
            const r = (i - Math.floor(total/2))*1.2;
            el.style.transform = `translateX(${x}px) translateY(${pos*2}px) rotate(${r}deg) scale(${s})`;
            el.style.opacity = 0.98 - pos*0.02;
            el.style.pointerEvents = 'none';
          } else {
            // hidden far cards
            el.classList.add('hidden');
            el.style.pointerEvents = 'none';
          }
        });
        document.getElementById('index').textContent = (index+1)+"";
      }

      applyStack();

      // navigation
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      prevBtn.addEventListener('click', ()=>{ index = (index-1+total)%total; applyStack(); });
      nextBtn.addEventListener('click', ()=>{ index = (index+1)%total; applyStack(); });

      // keyboard
      window.addEventListener('keydown', (e)=>{
        if(e.key === 'ArrowLeft') prevBtn.click();
        if(e.key === 'ArrowRight') nextBtn.click();
      });

      // swipe support
      let startX = 0, startY = 0, isTouching = false;
      gallery.addEventListener('touchstart', (e)=>{
        const t = e.touches[0]; startX = t.clientX; startY = t.clientY; isTouching = true;
      }, {passive:true});
      gallery.addEventListener('touchmove', (e)=>{ if(!isTouching) return; const t = e.touches[0]; const dx = t.clientX - startX; const dy = t.clientY - startY; if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 20){ if(dx>0) prevBtn.click(); else nextBtn.click(); isTouching=false; } }, {passive:true});
      gallery.addEventListener('touchend', ()=>{ isTouching=false; });

      // drag with mouse for desktop
      let dragStartX = 0, dragging=false;
      gallery.addEventListener('pointerdown',(e)=>{ gallery.setPointerCapture(e.pointerId); dragStartX = e.clientX; dragging=true; gallery.classList.add('dragging'); imgs.forEach(i=>i.classList.add('grabbing')); });
      window.addEventListener('pointermove',(e)=>{ if(!dragging) return; const dx = e.clientX - dragStartX; if(Math.abs(dx) > 60){ if(dx>0) prevBtn.click(); else nextBtn.click(); dragging=false; imgs.forEach(i=>i.classList.remove('grabbing')); } });
      window.addEventListener('pointerup',(e)=>{ dragging=false; imgs.forEach(i=>i.classList.remove('grabbing')); });

      // autoplay optional: flip every few seconds
      let autoplay = true;
      const flipInterval = 3500; // ms
      let timer = setInterval(()=>{ if(autoplay) nextBtn.click(); }, flipInterval);

      // pause autoplay on hover or touch
      gallery.addEventListener('mouseenter', ()=>autoplay=false);
      gallery.addEventListener('mouseleave', ()=>autoplay=true);
      gallery.addEventListener('touchstart', ()=>autoplay=false, {passive:true});
      gallery.addEventListener('touchend', ()=>autoplay=true);

      // music controls
      const bg = document.getElementById('bgMusic');
      const playBtn = document.getElementById('playMusic');
      const muteBtn = document.getElementById('muteMusic');
      playBtn.addEventListener('click', async ()=>{
        try{ await bg.play(); playBtn.textContent = 'Playing'; }catch(e){ alert('Browser blocked autoplay. Click the big Play button to start music.'); }
      });
      muteBtn.addEventListener('click', ()=>{ bg.muted = !bg.muted; muteBtn.textContent = bg.muted ? 'Unmute' : 'Mute'; });

      // Floating hearts generator
      const hearts = document.getElementById('hearts');
      function spawnHeart(){
        const h = document.createElement('div');
        h.className = 'heart';
        const size = Math.random()*18 + 10; h.style.width = size+'px'; h.style.height = size+'px';
        const left = Math.random()*100; h.style.left = left+'%';
        const top = 100 + Math.random()*20 + '%';
        h.style.top = top;
        h.style.setProperty('--dx', (Math.random()>0.5? 40 : -40) + 'vw');
        h.style.setProperty('--dy', (100 + Math.random()*80) + 'vh');
        h.style.opacity = 0.95; h.style.transform = `translate(-50%,-50%) scale(${0.7 + Math.random()*0.8}) rotate(${Math.random()*30 - 15}deg)`;
        h.style.animationDuration = (3.5 + Math.random()*3.5)+'s';
        hearts.appendChild(h);
        setTimeout(()=>{ h.remove(); }, 7000);
      }
      // spawn hearts slower when many images
      setInterval(spawnHeart, 600);

    }

  </script>
</body>
</html>
